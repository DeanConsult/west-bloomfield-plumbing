<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | West Bloomfield Plumbing</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --purple: #5b2d8e; --dark: #150d22; --white: #fff; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--white); border-radius: 16px; padding: 48px 40px; max-width: 500px; width: 100%; text-align: center; }
    .check { width: 64px; height: 64px; background: var(--purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .check svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-bottom: 12px; }
    p { color: #6b7280; line-height: 1.7; margin-bottom: 28px; }
    a.btn { display: inline-block; background: var(--purple); color: var(--white); padding: 13px 28px; border-radius: 8px; font-weight: 700; text-decoration: none; margin: 4px; }
    a.btn-outline { display: inline-block; border: 2px solid var(--purple); color: var(--purple); padding: 11px 28px; border-radius: 8px; font-weight: 700; text-decoration: none; margin: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>We Got Your Request!</h1>
    <p>Thank you for contacting West Bloomfield Plumbing. A member of our team will follow up with you within 1 business hour. For urgent matters, please call us directly.</p>
    <div>
      <a href="tel:2487733924" class="btn">Call 248-773-3924</a>
      <a href="../" class="btn-outline">Back to Home</a>
    </div>
  </div>
</body>
</html>
